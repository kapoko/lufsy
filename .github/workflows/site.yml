name: Site

env:
  IS_RELEASE: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
  SITE_RELEASE_CHANNEL: beta

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches:
      - main
      - dev
    paths:
      - site/**
      - .github/workflows/site.yml

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./site

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Download appcast artifact
        if: env.IS_RELEASE == 'true'
        uses: actions/download-artifact@v8
        with:
          name: appcast-files
          path: artifacts/appcast

      - name: Copy appcast files when available
        if: env.IS_RELEASE == 'true'
        run: |
          set -euo pipefail
          cp ../artifacts/appcast/dmg-arm64/appcast-arm64.xml static/appcast-arm64.xml
          cp ../artifacts/appcast/dmg-x86_64/appcast-x86_64.xml static/appcast-x86_64.xml

      - name: Preserve existing appcast files on non-release
        if: env.IS_RELEASE != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://lufsy.koman.app/appcast-arm64.xml" -o static/appcast-arm64.xml || true
          curl -fsSL "https://lufsy.koman.app/appcast-x86_64.xml" -o static/appcast-x86_64.xml || true

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${IS_RELEASE}" = "true" ]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="$({
              if [ "${SITE_RELEASE_CHANNEL}" = "stable" ]; then
                gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true
              else
                gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '[.[] | select(.prerelease == true)][0].tag_name' 2>/dev/null || true
              fi
            })"
            if [ -z "${release_tag}" ] || [ "${release_tag}" = "null" ]; then
              echo "No ${SITE_RELEASE_CHANNEL} release tag found"
              exit 1
            fi
          fi
          app_version="${release_tag#v}"

          arm64_size_mb=""
          x86_size_mb=""
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}")"
          arm64_bytes="$(printf '%s' "${release_json}" | jq -r --arg v "${app_version}" '[.assets[] | select(.name == ("Lufsy-darwin-arm64-" + $v + ".dmg")) | .size][0]')"
          x86_bytes="$(printf '%s' "${release_json}" | jq -r --arg v "${app_version}" '[.assets[] | select(.name == ("Lufsy-darwin-x86_64-" + $v + ".dmg")) | .size][0]')"

          if [ -n "${arm64_bytes}" ] && [ "${arm64_bytes}" != "null" ]; then
            arm64_size_mb="$(python3 -c "print(f'{int(${arm64_bytes}) / 1048576:.1f}')")"
          fi
          if [ -n "${x86_bytes}" ] && [ "${x86_bytes}" != "null" ]; then
            x86_size_mb="$(python3 -c "print(f'{int(${x86_bytes}) / 1048576:.1f}')")"
          fi

          HUGO_APP_VERSION="${app_version}" \
          HUGO_ARM64_SIZE_MB="${arm64_size_mb}" \
          HUGO_X86_SIZE_MB="${x86_size_mb}" \
          hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}
          path: site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    concurrency:
      group: site-deploy
      cancel-in-progress: true
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}
