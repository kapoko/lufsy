name: Site

env:
  IS_RELEASE: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_call:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./site

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Download appcast artifact
        if: env.IS_RELEASE == 'true'
        uses: actions/download-artifact@v8
        with:
          name: appcast-files
          path: artifacts/appcast

      - name: Copy appcast files when available
        if: env.IS_RELEASE == 'true'
        run: |
          set -euo pipefail
          cp ../artifacts/appcast/dmg-arm64/appcast-arm64.xml static/appcast-arm64.xml
          cp ../artifacts/appcast/dmg-x86_64/appcast-x86_64.xml static/appcast-x86_64.xml

      - name: Preserve existing appcast files on non-release
        if: env.IS_RELEASE != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://lufsy.koman.app/appcast-arm64.xml" -o static/appcast-arm64.xml || true
          curl -fsSL "https://lufsy.koman.app/appcast-x86_64.xml" -o static/appcast-x86_64.xml || true

      - name: Build
        run: |
          set -euo pipefail
          HUGO_APP_VERSION="$(tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"; [ -n "$tag" ] && [ "$tag" != "null" ] && printf '%s' "${tag#v}" || printf '0.0.0')" hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
