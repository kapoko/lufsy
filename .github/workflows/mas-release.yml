name: MAS Release

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Tag or branch to build (defaults to current ref)"
        required: false
        type: string

jobs:
  release-mas:
    runs-on: macos-26
    env:
      MAS_SIGNING_IDENTITY: ${{ secrets.MAS_SIGNING_IDENTITY }}
      MAS_INSTALLER_IDENTITY: ${{ secrets.MAS_INSTALLER_IDENTITY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Validate required secrets
        env:
          MAS_CERT_P12_B64: ${{ secrets.MAS_CERT_P12_B64 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_INSTALLER_CERT_P12_B64: ${{ secrets.MAS_INSTALLER_CERT_P12_B64 }}
          MAS_INSTALLER_CERT_PASSWORD: ${{ secrets.MAS_INSTALLER_CERT_PASSWORD }}
          MAS_PROVISIONING_PROFILE_B64: ${{ secrets.MAS_PROVISIONING_PROFILE_B64 }}
        run: |
          set -euo pipefail
          test -n "${MAS_SIGNING_IDENTITY}"
          test -n "${MAS_INSTALLER_IDENTITY}"
          test -n "${MAS_CERT_P12_B64}"
          test -n "${MAS_CERT_PASSWORD}"
          test -n "${MAS_INSTALLER_CERT_P12_B64}"
          test -n "${MAS_INSTALLER_CERT_PASSWORD}"
          test -n "${MAS_PROVISIONING_PROFILE_B64}"
          test -n "${APPLE_API_KEY_ID}"
          test -n "${APPLE_API_ISSUER_ID}"
          test -n "${APPLE_API_PRIVATE_KEY_B64}"

      - name: Import App Store certificates
        env:
          MAS_CERT_P12_B64: ${{ secrets.MAS_CERT_P12_B64 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_INSTALLER_CERT_P12_B64: ${{ secrets.MAS_INSTALLER_CERT_P12_B64 }}
          MAS_INSTALLER_CERT_PASSWORD: ${{ secrets.MAS_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/mas-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          APP_CERT_PATH="$RUNNER_TEMP/mas-app.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/mas-installer.p12"

          printf '%s' "${MAS_CERT_P12_B64}" | base64 --decode > "$APP_CERT_PATH"
          printf '%s' "${MAS_INSTALLER_CERT_P12_B64}" | base64 --decode > "$INSTALLER_CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security import "$APP_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security import "$INSTALLER_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAS_INSTALLER_CERT_PASSWORD" -T /usr/bin/productsign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null 2>&1

      - name: Prepare provisioning profile
        env:
          MAS_PROVISIONING_PROFILE_B64: ${{ secrets.MAS_PROVISIONING_PROFILE_B64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/Lufsy.provisionprofile"
          printf '%s' "${MAS_PROVISIONING_PROFILE_B64}" | base64 --decode > "$PROFILE_PATH"
          echo "MAS_PROVISIONING_PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Build App Store package
        run: make pkg-mas

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: mas-pkg
          path: dist/Lufsy-mas-*.pkg
          if-no-files-found: error
          compression-level: 0

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_PRIVATE_KEY_B64}" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPSTORE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Upload package to App Store Connect
        run: |
          set -euo pipefail
          pkg="$(ls dist/Lufsy-mas-*.pkg)"
          xcrun altool --upload-app \
            --type macos \
            --file "$pkg" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"
